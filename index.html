<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1F5BC4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Week">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Iron Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Open Floor. One flat surface, no stacked cards.
   Reading order on a day screen: where am I (blue header) > which exercise (the one open row)
   > what do I do (weight, reps) > the one button that does it (Log set), pinned in the thumb zone.
   Rules held throughout: tap targets 44px or more, text contrast 4.5:1 or more in both themes,
   state never shown by colour alone, no motion when the system asks for none.
   Token names (--bg --surface --ink --muted --line --accent --chip --f-display --f-num) are shared
   with guide.js, so keep them. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --raise:#E9EDF2; --ink:#12161C; --muted:#5F6B7A; --line:#D9DEE5;
  --chip:#E9EDF2; --accent:#1F5BC4; --accent-text:#1F55B5; --on-accent:#FFFFFF; --on-accent-2:#DCE7FA;
  --done-bg:#E3ECFB; --done-ink:#1B4FA8; --good:#1E7A45; --warn:#8A5A00; --bad:#B3261E;
  --btn:#12161C; --btn-ink:#FFFFFF; --ring:#12161C;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12161C; --surface:#1C232C; --raise:#27303B; --ink:#EEF1F5; --muted:#8F9BAA; --line:#27303B;
  --chip:#27303B; --accent-text:#8FB4F2; --done-bg:#1A2A47; --done-ink:#A9C6F8;
  --good:#5FCB8A; --warn:#E2B33B; --bad:#F2877F; --btn:#FFFFFF; --btn-ink:#12161C; --ring:#FFFFFF;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.top :focus-visible,.hero :focus-visible{outline-color:#fff}

/* Blue header: day tabs stick to the top, the title scrolls away */
.top{position:sticky;top:0;z-index:4;background:var(--accent);color:var(--on-accent);padding-top:env(safe-area-inset-top,0px)}
.days{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:0 max(8px,env(safe-area-inset-left,0px)) 0 max(8px,env(safe-area-inset-right,0px))}
.tab{appearance:none;border:none;background:none;min-height:48px;padding:0;cursor:pointer;color:var(--on-accent-2);font:700 15px var(--f-display);letter-spacing:.08em;text-transform:uppercase;position:relative;display:flex;align-items:center;justify-content:center;gap:5px}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#fff}
.tab .ck{width:14px;height:14px}
.tab .today{width:6px;height:6px;border-radius:50%;background:currentColor}
.hero{background:var(--accent);color:var(--on-accent);padding:6px 0 22px}
.hero .in{max-width:560px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left,0px)) 0 max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent-2);font-weight:600}
.hero h1{margin:0;font:800 clamp(38px,12vw,48px)/.92 var(--f-display);text-transform:uppercase;text-wrap:balance}
.hero .sub{margin:0;font-size:15px;color:var(--on-accent-2)}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s}
.count{display:flex;justify-content:space-between;font:600 14px var(--f-num);font-variant-numeric:tabular-nums}

/* Content column */
.col{max-width:560px;margin:0 auto;padding:6px max(20px,env(safe-area-inset-left,0px)) 190px max(20px,env(safe-area-inset-right,0px))}
.tip{margin:14px 0 4px;color:var(--muted);font-size:14px}
.tip b{color:var(--ink);font-weight:600}

/* Exercise rows: plain lines, hairline dividers. Only the open one grows. */
.rows{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--line);scroll-margin-top:64px}
.rh{display:flex;align-items:stretch;min-height:56px}
.pick{appearance:none;border:none;background:none;flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;padding:8px 0}
.pick .nm{font-weight:600;font-size:17px;line-height:1.25}
.pick .tg{font:500 13px var(--f-num);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.row.done .nm{color:var(--muted);font-weight:500}
.row.done .tg{color:var(--good)}
.tg svg{width:16px;height:16px}
.guide{appearance:none;border:none;background:none;width:44px;min-height:44px;align-self:center;display:grid;place-items:center;cursor:pointer;color:var(--muted);border-radius:12px}
.guide svg{width:22px;height:22px}
.guide:hover{color:var(--ink)}

.row.cur{padding-bottom:20px}
.row.cur .rh{min-height:0;padding-top:14px}
.row.cur .pick{cursor:default;padding:0}
.row.cur .nm{font:700 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.row.cur .tg{display:none}
.howto{appearance:none;border:none;background:none;min-height:44px;padding:0 0 0 12px;display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--accent-text);font:600 15px var(--f-body);white-space:nowrap}
.howto svg{width:20px;height:20px}
.howto span{text-decoration:underline;text-underline-offset:3px}
.last{margin:2px 0 0;font-size:14px;color:var(--muted)}
.last b{font:500 13px var(--f-num);color:var(--ink)}
.last em{font-style:normal;color:var(--accent-text);font-weight:600}

/* Set strip: segmented control. Selected = outline, done = tinted + check, not yet = dash. */
.sets{display:grid;gap:8px;margin:16px 0 0}
.set{appearance:none;border:1.5px solid var(--line);background:none;border-radius:12px;min-height:60px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
.set .cv{font:700 15px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.set .sl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:3px}
.set .sl svg{width:12px;height:12px}
.set.done{background:var(--done-bg);border-color:transparent;color:var(--done-ink)}
.set.sel{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.set.done.sel{border-color:var(--ink);color:var(--done-ink)}

/* Stepper rows: the two numbers you change. */
.field{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin-top:12px}
.field>button{appearance:none;border:none;background:var(--raise);color:var(--ink);border-radius:14px;height:56px;font:500 28px var(--f-body);cursor:pointer;display:grid;place-items:center;line-height:1}
.field>button:active{transform:scale(.97)}
.val{display:flex;align-items:baseline;justify-content:center;gap:8px;min-width:0}
.val input{width:5.2ch;max-width:100%;text-align:center;background:none;border:none;border-bottom:2px solid var(--line);border-radius:0;color:var(--ink);font:700 44px/1.1 var(--f-num);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;min-width:0}
.val input:focus{outline:none;border-bottom-color:var(--accent-text)}
.val input:focus-visible{outline:none}
.val input::-webkit-outer-spin-button,.val input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.val .u{appearance:none;border:none;background:none;color:var(--muted);font:500 15px var(--f-body);min-width:44px;min-height:44px;padding:0;cursor:pointer;text-align:left}
.val button.u{text-decoration:underline dotted;text-underline-offset:4px}
.val button.u::after{content:" ⇅";font-size:12px;text-decoration:none;display:inline-block}
.undo{appearance:none;border:none;background:none;color:var(--accent-text);font:600 15px var(--f-body);min-height:44px;padding:0;margin-top:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Bottom dock: rest timer above, the one primary action below */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 72%,transparent);pointer-events:none}
.dock>*{pointer-events:auto;max-width:528px;margin-left:auto;margin-right:auto}
.rest{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:4px 4px 4px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rest .lbl{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rest .t{font:700 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.rest .acts{display:flex}
.rest button{appearance:none;border:none;background:none;min-width:56px;min-height:48px;padding:0 10px;border-radius:12px;cursor:pointer;font:600 15px var(--f-body);color:var(--accent-text)}
.rest.over{background:var(--good);border-color:var(--good);color:#fff}
.rest.over .lbl{color:#fff}
.rest.over button{color:#fff}
@media (prefers-color-scheme: dark){.rest.over{color:#0B2415}.rest.over .lbl,.rest.over button{color:#0B2415}}
.log{appearance:none;border:none;width:100%;min-height:58px;border-radius:16px;background:var(--btn);color:var(--btn-ink);font:700 18px var(--f-body);cursor:pointer;display:block}
.log:active{transform:scale(.99)}

/* Body & abs: flat sections */
.sec{padding:22px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.sec h2{margin:0;font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.sec p{margin:0}
.muted{color:var(--muted);font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good)}
.pill.warn{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{font:700 26px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.spark{width:100%;height:96px;display:block}
.chart-cap{display:flex;justify-content:space-between;font:500 12px var(--f-num);color:var(--muted)}
.bwform{display:flex;gap:10px}
.bwform label{flex:1;position:relative;min-width:0}
.bwform input{width:100%;min-height:52px;font:700 20px var(--f-num);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 44px 0 14px;-moz-appearance:textfield}
.bwform input:focus{outline:none;border-color:var(--accent-text)}
.bwform input::-webkit-outer-spin-button,.bwform input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bwform label span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.btn{appearance:none;border:none;background:var(--btn);color:var(--btn-ink);font:700 16px var(--f-body);min-height:52px;padding:0 20px;border-radius:14px;cursor:pointer}
.btn.quiet{background:var(--raise);color:var(--ink);font-weight:600}
.btn.sm{min-height:44px;font-size:15px;padding:0 16px;border-radius:12px}
.log-list{list-style:none;margin:0;padding:0}
.log-list li{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-top:1px solid var(--line);font:500 14px var(--f-num);font-variant-numeric:tabular-nums}
.x{appearance:none;border:none;background:none;color:var(--muted);width:44px;height:44px;cursor:pointer;font-size:22px;border-radius:12px}
.nights{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.night{appearance:none;border:1.5px solid var(--line);background:none;border-radius:12px;min-height:52px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 15px var(--f-display);letter-spacing:.04em;color:var(--ink)}
.night svg{width:14px;height:14px;opacity:0}
.night[aria-pressed="true"]{background:var(--done-bg);border-color:transparent;color:var(--done-ink)}
.night[aria-pressed="true"] svg{opacity:1}
.night.today{border-color:var(--ink)}
ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.confirm{display:flex;flex-direction:column;gap:12px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><nav class="days" id="days" aria-label="Training days"></nav></header>
<div id="hero"></div>
<main class="col" id="main"></main>

<div class="dock" id="dock" hidden>
  <div class="rest" id="rest" role="timer" aria-label="Rest timer" hidden>
    <div><span class="lbl" id="tlbl">Rest</span><span class="t" id="tval">0:00</span></div>
    <div class="acts"><button id="tplus">+30s</button><button id="tskip">Skip</button></div>
  </div>
  <button class="log" id="log"></button>
</div>
<div class="sr" id="live" aria-live="polite" role="status"></div>

<script src="guide.js"></script>
<script>
const PLAN = [
  {id:'mon', short:'Mon', day:'Monday', title:'Legs', sub:'Quads', leg:true, ex:[
    ['Hack squat',4,'6–10',180,'kg'],['Leg press',3,'8–10',180,'kg'],['Leg extensions',3,'10–12',90,'kg'],['Calf raises',3,'10–15',90,'kg']]},
  {id:'tue', short:'Tue', day:'Tuesday', title:'Chest, Shoulders & Biceps', sub:'Push + curls', ex:[
    ['Bench press',4,'6–10',180,'kg'],['Weighted dips',3,'6–10',150,'kg'],['Incline dumbbell press',3,'8–12',120,'kg'],['Flyes',3,'10–12',90,'lb'],['Lateral raises',3,'10–15',60,'kg'],['Dumbbell curls',3,'8–12',60,'kg']]},
  {id:'wed', short:'Wed', day:'Wednesday', title:'Back & Triceps', sub:'Pull + a bit of chest', ex:[
    ['Weighted pull-ups',4,'6–10',150,'kg'],['Incline dumbbell press',3,'8–12',120,'kg'],['Rows',3,'8–12',120,'kg'],['Overhead triceps extension',3,'8–12',90,'kg'],['Triceps pushdowns',3,'10–12',60,'kg']]},
  {id:'thu', short:'Thu', day:'Thursday', title:'Legs', sub:'Hamstrings & glutes', leg:true, ex:[
    ['Romanian deadlifts / hip thrusts',3,'6–10',180,'kg'],['Hack squat (lighter)',3,'8–10',180,'kg'],['Leg curls',3,'10–12',90,'kg'],['Calf raises',3,'10–15',90,'kg']]}
];
const LS='ironweek.v1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function weekKey(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}
function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S=load();
S.sets=S.sets||{}; S.abs=S.abs||[]; S.bw=S.bw||[]; S.last=S.last||{}; S.units=S.units||{};
if(!S.bw.length && !S.started){S.bw=[{d:ymd(new Date()),kg:55}];}
S.started=true;
function checkWeek(){const wk=weekKey(new Date());if(S.week!==wk){S.week=wk;S.sets={};S.abs=[];save();}}
checkWeek();

const todayIdx=()=>(new Date().getDay()+6)%7; // 0=Mon
let view=(()=>{const i=todayIdx();return i<4?PLAN[i].id:'body'})();
let confirmReset=false;
let openEx={};   // day id -> index of the open exercise
let sel={};      // day id -> {i,k}: the set being edited

/* ---------- data helpers ---------- */
function setsFor(day,i){const id=day.id+'-'+i;const n=day.ex[i][1];if(!S.sets[id])S.sets[id]=[];while(S.sets[id].length<n)S.sets[id].push({w:'',r:'',done:false});return S.sets[id]}
function dayCount(day){let d=0,t=0;day.ex.forEach((e,i)=>{const arr=S.sets[day.id+'-'+i]||[];t+=e[1];d+=arr.filter(s=>s.done).length});return [d,t]}
const unitOf=e=>S.units[e[0]]||e[4];
const lowReps=e=>e[2].split('–')[0];
const highReps=e=>+e[2].split('–')[1]||0;
const stepOf=e=>unitOf(e)==='lb'?5:2.5;
function firstOpen(day){for(let i=0;i<day.ex.length;i++){if(!setsFor(day,i).every(s=>s.done))return i}return -1}
function curOpen(day){return openEx[day.id]!==undefined?openEx[day.id]:firstOpen(day)}
function curSel(day,i){const s=sel[day.id];if(s&&s.i===i)return s.k;const arr=setsFor(day,i);const k=arr.findIndex(x=>!x.done);return k<0?arr.length-1:k}
/* Suggested numbers for a set: what you typed, else the set before it, else last session, else the bottom of the range.
   Pre-filling means a normal set is one tap. */
function shown(e,arr,k){
  const s=arr[k]; let prev=null;
  for(let j=k-1;j>=0;j--){if(arr[j].done){prev=arr[j];break}}
  const L=S.last[e[0]];
  return {
    w:s.w!==''?s.w:(prev&&prev.w!==''?prev.w:(L?L.w:'')),
    r:s.r!==''?s.r:(prev?prev.r:(L?L.r:lowReps(e)))
  };
}

/* ---------- icons ---------- */
const I={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5M12 7.5v.01" stroke-width="2.4"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></svg>'
};
const hasGuide=n=>typeof window.hasGuide==='function'&&window.hasGuide(n);

/* ---------- header ---------- */
function renderDays(){
  const ti=todayIdx();
  const t=PLAN.map((d,i)=>{const [dn,tt]=dayCount(d);
    return `<button class="tab" data-view="${d.id}"${view===d.id?' aria-current="page"':''}>${dn===tt?I.check.replace('<svg','<svg class="ck"'):''}${d.short}${ti===i&&dn!==tt?'<i class="today" aria-hidden="true"></i><span class="sr"> (today)</span>':''}</button>`});
  const absN=S.abs.filter(Boolean).length;
  t.push(`<button class="tab" data-view="body"${view==='body'?' aria-current="page"':''}>Body${ti>=4?'<i class="today" aria-hidden="true"></i><span class="sr"> (today)</span>':''}</button>`);
  document.getElementById('days').innerHTML=t.join('');
}
function renderHero(day){
  const el=document.getElementById('hero');
  if(day){
    const [dn,t]=dayCount(day);
    el.innerHTML=`<section class="hero"><div class="in"><p class="eyebrow">${day.day} · ${esc(day.sub)}</p><h1>${esc(day.title)}</h1>
      <div class="meter" role="progressbar" aria-label="Sets done" aria-valuemin="0" aria-valuemax="${t}" aria-valuenow="${dn}"><i style="width:${t?dn/t*100:0}%"></i></div>
      <div class="count"><span>${dn} of ${t} sets</span><span>${dn===t?'Workout done':(t-dn)+' to go'}</span></div></div></section>`;
  }else{
    const ti=todayIdx();
    el.innerHTML=ti>=4
      ?`<section class="hero"><div class="in"><p class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long'})}</p><h1>Rest day</h1><p class="sub">Recovery is when you grow. Eat, sleep 7–9 hours, log your weight.</p></div></section>`
      :`<section class="hero"><div class="in"><p class="eyebrow">Week of ${new Date(S.week+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}</p><h1>Body &amp; abs</h1><p class="sub">Weight, ab nights and the rules.</p></div></section>`;
  }
}

/* ---------- day screen ---------- */
function chipText(e,arr,j,k){
  const s=arr[j];
  if(!s.done&&j!==k) return '–';
  const v=shown(e,arr,j);
  return `${esc(v.w===''?'–':v.w)}×${esc(v.r)}`;
}
function renderDay(day){
  let h='';
  if(day.leg) h+=`<p class="tip"><b>Leg day.</b> Walk between sets, don't sit. Leave 2–3 reps in the tank. Eat 1.5–2 h before.</p>`;
  const oi=curOpen(day);
  h+='<ol class="rows">';
  day.ex.forEach((e,i)=>{
    const arr=setsFor(day,i), u=unitOf(e), L=S.last[e[0]];
    const nd=arr.filter(s=>s.done).length, done=nd===arr.length, open=i===oi;
    const guide=hasGuide(e[0]);
    if(!open){
      h+=`<li class="row${done?' done':''}" id="ex-${i}"><div class="rh">
        <button class="pick" data-pick="${i}"><span class="nm">${esc(e[0])}</span><span class="tg">${done?I.check+nd+'/'+arr.length:(nd?nd+'/'+arr.length:e[1]+' × '+e[2])}</span></button>
        ${guide?`<button class="guide" data-guide="${esc(e[0])}" aria-label="How to do ${esc(e[0])}">${I.info}</button>`:''}</div></li>`;
      return;
    }
    const k=curSel(day,i), s=arr[k], v=shown(e,arr,k);
    const tryMore=L&&highReps(e)&&+L.r>=highReps(e);
    h+=`<li class="row cur" id="ex-${i}"><div class="rh"><div class="pick"><span class="nm">${esc(e[0])}</span></div>
      ${guide?`<button class="howto" data-guide="${esc(e[0])}" aria-label="How to do ${esc(e[0])}">${I.img}<span>How to</span></button>`:''}</div>
      <p class="last">${e[1]} × ${e[2]} · ${L?`last time <b>${esc(L.w)} ${esc(L.u)} × ${esc(L.r)}</b>${tryMore?' · <em>time to add weight</em>':''}`:'no weight logged yet'}${v.w===''?' · <em>tap the number to type it</em>':''}</p>
      <div class="sets" style="grid-template-columns:repeat(${arr.length},1fr)" role="group" aria-label="Sets">`+
      arr.map((x,j)=>`<button class="set${x.done?' done':''}${j===k?' sel':''}" data-sel="${j}" aria-pressed="${j===k}" aria-label="Set ${j+1}${x.done?', done':''}"><span class="cv">${chipText(e,arr,j,k)}</span><span class="sl">${x.done?I.check:''}Set ${j+1}</span></button>`).join('')+`</div>
      <div class="field"><button data-bump="w" data-d="-1" aria-label="Less weight">−</button>
        <div class="val"><input id="w-in" inputmode="decimal" type="number" step="0.5" min="0" value="${esc(v.w)}" placeholder="–" data-f="w" aria-label="Weight for set ${k+1}"><button class="u" data-unit="${i}" aria-label="Unit is ${u}, tap to switch">${u}</button></div>
        <button data-bump="w" data-d="1" aria-label="More weight">+</button></div>
      <div class="field"><button data-bump="r" data-d="-1" aria-label="Fewer reps">−</button>
        <div class="val"><input id="r-in" inputmode="numeric" type="number" step="1" min="0" value="${esc(v.r)}" placeholder="0" data-f="r" aria-label="Reps for set ${k+1}"><span class="u">reps</span></div>
        <button data-bump="r" data-d="1" aria-label="More reps">+</button></div>
      ${s.done?`<button class="undo" data-undo="${k}">Mark set ${k+1} as not done</button>`:''}
    </li>`;
  });
  return h+'</ol>';
}

/* ---------- body screen ---------- */
function spark(pts){
  if(pts.length<2) return '<p class="muted">Log your weight a few mornings a week to see the trend.</p>';
  const W=320,H=96,P=10; const ks=pts.map(p=>p.kg);
  let lo=Math.min(...ks),hi=Math.max(...ks); if(hi-lo<1){const m=(hi+lo)/2;lo=m-.5;hi=m+.5}
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join('');
  const area=line+`L${x(pts.length-1).toFixed(1)},${H-P}L${x(0).toFixed(1)},${H-P}Z`;
  const lx=x(pts.length-1),ly=y(pts[pts.length-1].kg);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bodyweight trend, ${lo.toFixed(1)} to ${hi.toFixed(1)} kilograms">
    <line x1="${P}" x2="${W-P}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${P}" x2="${W-P}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${area}" fill="var(--accent-text)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent-text)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="4.5" fill="var(--accent-text)"/></svg>
    <div class="chart-cap"><span>${pts[0].d.slice(5)}</span><span>${lo.toFixed(1)}–${hi.toFixed(1)} kg</span><span>${pts[pts.length-1].d.slice(5)}</span></div>`;
}
function renderBody(){
  const bw=[...S.bw].sort((a,b)=>a.d<b.d?-1:1);
  const last=bw[bw.length-1], first=bw[0];
  let rate=null;
  if(bw.length>1){const days=(new Date(last.d)-new Date(first.d))/864e5; if(days>=7) rate=(last.kg-first.kg)/(days/7);}
  let pill='<span class="pill">Needs 1+ week of entries</span>';
  if(rate!==null){ if(rate<0.2) pill='<span class="pill warn">Too slow · eat more</span>'; else if(rate>0.6) pill='<span class="pill warn">Fast · ease off a little</span>'; else pill=`<span class="pill good">${I.check.replace('<svg','<svg width="14" height="14"')}On track</span>`; }
  const ti=todayIdx(), names=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], absN=S.abs.filter(Boolean).length;
  let h='';
  h+=`<section class="sec"><div class="hd"><h2>Bodyweight</h2>${pill}</div>
    <div class="stats"><div class="stat"><small>Now</small><b>${last?last.kg.toFixed(1):'–'}</b></div>
    <div class="stat"><small>Change</small><b>${bw.length>1?((last.kg-first.kg>=0?'+':'')+(last.kg-first.kg).toFixed(1)):'–'}</b></div>
    <div class="stat"><small>Per week</small><b>${rate!==null?(rate>=0?'+':'')+rate.toFixed(2):'–'}</b></div></div>
    ${spark(bw.slice(-30))}
    <form class="bwform" id="bwform"><label><span class="sr">Today's weight in kilograms</span><input id="bwin" type="number" inputmode="decimal" step="0.1" placeholder="${last?last.kg:'55'}"><span aria-hidden="true">kg</span></label><button class="btn" type="submit">Log today</button></form>
    <p class="muted">Aim for +0.25–0.5 kg a week. Weigh in the morning before eating.</p>
    <ul class="log-list">${bw.slice(-6).reverse().map(p=>`<li><span>${p.d}</span><span>${p.kg.toFixed(1)} kg <button class="x" data-del="${p.d}" aria-label="Delete entry from ${p.d}">×</button></span></li>`).join('')}</ul></section>`;
  h+=`<section class="sec"><div class="hd"><h2>Abs</h2><span class="pill${absN>=3?' good':''}">${absN} of 3–4 nights</span></div>
    <p class="muted">Standing ab wheel rollouts, 3 × 6–10. Partial range first, back stays flat.</p>
    <div class="nights" role="group" aria-label="Nights you trained abs">${names.map((n,i)=>`<button class="night${i===ti?' today':''}" data-abs="${i}" aria-pressed="${!!S.abs[i]}" aria-label="${n}${i===ti?' (today)':''}">${n[0]}${I.check}</button>`).join('')}</div></section>`;
  h+=`<section class="sec"><h2>Rules</h2><ul class="rules">
    <li>Leave 1–3 reps in the tank. On legs, 2–3 for the first month.</li>
    <li>Rest 2–3 min on legs, presses and weighted pull-ups/dips; 1–2 min on the rest.</li>
    <li>Beat last week: one more rep, or a little more weight once you hit the top of the range.</li>
    <li>90–120 g protein a day. Sleep 7–9 hours.</li></ul></section>`;
  h+=`<section class="sec" style="border-bottom:none"><h2>This week</h2><p class="muted">Sets and abs reset every Monday. Weights, last lifts and bodyweight stay. Everything is saved on this phone only.</p>
    ${confirmReset?`<div class="confirm"><p>Clear all logged sets for this week?</p><div class="btns"><button class="btn sm" data-act="reset-yes">Clear week</button><button class="btn quiet sm" data-act="reset-no">Keep</button></div></div>`:`<div><button class="btn quiet sm" data-act="reset">Clear this week's sets</button></div>`}</section>`;
  return h;
}

/* ---------- render ---------- */
const mainEl=document.getElementById('main');
function render(){
  checkWeek();
  const d=PLAN.find(p=>p.id===view);
  renderDays(); renderHero(d);
  mainEl.innerHTML=d?renderDay(d):renderBody();
  updateDock();
}
/* Re-render but keep scroll position and keyboard focus on the same control */
function rerender(focusSel){
  const y=window.scrollY;
  const a=document.activeElement;
  const key=focusSel||(a&&a.closest&&a.closest('main')&&keyOf(a));
  render(); window.scrollTo(0,y);
  if(key){const el=document.querySelector(key);if(el)try{el.focus({preventScroll:true})}catch(e){}}
}
function keyOf(el){
  for(const a of ['data-bump','data-unit','data-sel','data-pick','data-undo','data-abs','data-act']){
    if(el.hasAttribute(a)){return `[${a}="${el.getAttribute(a)}"]`+(a==='data-bump'?`[data-d="${el.dataset.d}"]`:'')}
  }
  return null;
}
const say=t=>{const l=document.getElementById('live');l.textContent='';setTimeout(()=>{l.textContent=t},30)};

/* ---------- dock: rest timer + Log button ---------- */
let tEnd=0,tTick=null,buzzed=false;
const dockEl=document.getElementById('dock'),restEl=document.getElementById('rest'),logEl=document.getElementById('log');
function updateDock(){
  const d=PLAN.find(p=>p.id===view);
  let showLog=false;
  if(d){const i=curOpen(d);if(i>=0){showLog=true;const k=curSel(d,i);logEl.textContent=(setsFor(d,i)[k].done?'Update set ':'Log set ')+(k+1);}}
  logEl.hidden=!showLog;
  dockEl.hidden=logEl.hidden&&restEl.hidden;
}
function startTimer(sec,label){
  tEnd=Date.now()+sec*1000;buzzed=false;
  document.getElementById('tlbl').textContent='Rest · '+label;
  restEl.hidden=false;restEl.classList.remove('over');
  clearInterval(tTick);tTick=setInterval(tick,250);tick();updateDock();
}
function tick(){
  const left=Math.round((tEnd-Date.now())/1000),a=Math.abs(left);
  document.getElementById('tval').textContent=(left<0?'+':'')+Math.floor(a/60)+':'+pad(a%60);
  if(left<=0){
    if(!restEl.classList.contains('over')){restEl.classList.add('over');document.getElementById('tlbl').textContent='Rest over · go';}
    if(!buzzed){buzzed=true;say('Rest over');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
  }
}
document.getElementById('tplus').onclick=()=>{tEnd+=30000;buzzed=false;restEl.classList.remove('over');tick()};
document.getElementById('tskip').onclick=()=>{clearInterval(tTick);restEl.hidden=true;updateDock()};
logEl.onclick=()=>{const d=PLAN.find(p=>p.id===view);if(!d)return;const i=curOpen(d);if(i<0)return;logSet(d,i,curSel(d,i))};

function logSet(d,i,k){
  const ex=d.ex[i], arr=setsFor(d,i), s=arr[k], wasDone=s.done, v=shown(ex,arr,k);
  s.w=v.w; s.r=v.r; s.done=true;
  if(s.w!=='')S.last[ex[0]]={w:s.w,r:s.r,u:unitOf(ex)};
  delete sel[d.id];
  const finished=arr.every(x=>x.done);
  let msg=`Set ${k+1} ${wasDone?'updated':'logged'}.`;
  if(!wasDone){startTimer(ex[3],ex[0]);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
  let scrollTo=null;
  if(finished){const n=firstOpen(d);openEx[d.id]=n;if(n>=0){scrollTo=n;msg+=` ${ex[0]} done. Next: ${d.ex[n][0]}.`}else msg+=' Workout done.';}
  save();rerender();say(msg);
  if(scrollTo!==null){const el=document.getElementById('ex-'+scrollTo);if(el)el.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
}

/* ---------- events ---------- */
document.getElementById('days').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;confirmReset=false;render();window.scrollTo(0,0)});
function refreshLive(d){
  // Update the selected set's chip and the Log label without rebuilding the panel (keeps the caret while typing)
  const i=curOpen(d);if(i<0)return;const k=curSel(d,i),arr=setsFor(d,i),e=d.ex[i];
  const chip=mainEl.querySelector(`.set[data-sel="${k}"] .cv`);if(chip)chip.textContent=chipText(e,arr,k,k).replace(/&amp;/g,'&');
}
mainEl.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset.f)return;
  const d=PLAN.find(p=>p.id===view),i=curOpen(d),k=curSel(d,i);
  setsFor(d,i)[k][t.dataset.f]=t.value;save();refreshLive(d);
});
mainEl.addEventListener('click',e=>{
  const d=PLAN.find(p=>p.id===view);
  if(d){
    if(e.target.closest('[data-guide]'))return; // guide.js handles it
    const p=e.target.closest('[data-pick]');
    if(p){openEx[d.id]=+p.dataset.pick;delete sel[d.id];rerender();const el=document.getElementById('ex-'+p.dataset.pick);if(el)el.scrollIntoView({block:'nearest'});return;}
    const c=e.target.closest('[data-sel]');
    if(c){const i=curOpen(d);sel[d.id]={i,k:+c.dataset.sel};rerender();return;}
    const b=e.target.closest('[data-bump]');
    if(b){
      const i=curOpen(d),k=curSel(d,i),ex=d.ex[i],arr=setsFor(d,i),f=b.dataset.bump;
      const cur=parseFloat(shown(ex,arr,k)[f])||0;
      const st=f==='w'?stepOf(ex):1;let v=Math.max(0,cur+(+b.dataset.d)*st);
      v=f==='r'?Math.round(v):Math.round(v*2)/2;
      arr[k][f]=String(v);
      // keep the other number pinned too, so it can't shift under the user
      const o=f==='w'?'r':'w';if(arr[k][o]==='')arr[k][o]=String(shown(ex,arr,k)[o]);
      const inp=mainEl.querySelector(`input[data-f="${f}"]`);inp.value=v;
      save();refreshLive(d);return;
    }
    const un=e.target.closest('[data-undo]');
    if(un){const i=curOpen(d),k=+un.dataset.undo;setsFor(d,i)[k].done=false;sel[d.id]={i,k};save();rerender('[data-sel="'+k+'"]');say(`Set ${k+1} marked not done.`);return;}
    const u=e.target.closest('[data-unit]');
    if(u){const ex=d.ex[+u.dataset.unit];S.units[ex[0]]=unitOf(ex)==='kg'?'lb':'kg';save();rerender();say('Unit is now '+unitOf(ex));return;}
  }
  const a=e.target.closest('[data-abs]');
  if(a){const i=+a.dataset.abs;S.abs[i]=!S.abs[i];save();rerender();return;}
  const x=e.target.closest('[data-del]');
  if(x){S.bw=S.bw.filter(p=>p.d!==x.dataset.del);save();render();return;}
  const act=e.target.closest('[data-act]');
  if(act){const v=act.dataset.act;if(v==='reset')confirmReset=true;if(v==='reset-no')confirmReset=false;if(v==='reset-yes'){S.sets={};S.abs=[];openEx={};sel={};confirmReset=false;save();say('This week cleared.')}rerender(v==='reset'?'[data-act="reset-yes"]':'[data-act="reset"]');}
});
mainEl.addEventListener('submit',e=>{if(e.target.id!=='bwform')return;e.preventDefault();const v=parseFloat(document.getElementById('bwin').value);if(!(v>20&&v<300))return;const t=ymd(new Date());S.bw=S.bw.filter(p=>p.d!==t);S.bw.push({d:t,kg:v});save();render();say('Weight logged.')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();wake()}});

/* Keep the screen on while you train (ignored where unsupported) */
let lock=null;
async function wake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}catch(e){}}
wake();

render();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
