<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12161B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Week">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Iron Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone logbook — day strip on top, exercise cards, rest timer pinned to the bottom */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#1B2128; --muted:#5E6873; --line:#D5DAE0;
  --chip:#E3E7EB; --accent:#C8372B; --accent-ink:#FFFFFF; --accent-soft:#F6DEDB;
  --good:#2F7D4F; --good-soft:#DCEFE3; --warn:#9A6A12;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161B; --surface:#1B2128; --ink:#E9EDF1; --muted:#95A0AB; --line:#2C343D;
  --chip:#232A32; --accent:#E5534A; --accent-ink:#FFFFFF; --accent-soft:#3A2224;
  --good:#4FB37A; --good-soft:#1E3328; --warn:#D9A440; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161B; --surface:#1B2128; --ink:#E9EDF1; --muted:#95A0AB; --line:#2C343D;
  --chip:#232A32; --accent:#E5534A; --accent-ink:#FFFFFF; --accent-soft:#3A2224;
  --good:#4FB37A; --good-soft:#1E3328; --warn:#D9A440; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.wk{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 4px 7px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tab b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.tab small{font-family:var(--f-num);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.on small{color:var(--bg);opacity:.75}
.tab.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tab.full small{color:var(--good)}
.tab.on.full small{color:var(--bg)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dayhead{display:flex;flex-direction:column;gap:6px}
.dayhead h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:40px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.dayhead p{margin:0;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bar.done i{background:var(--good)}
.note{font-size:13px;color:var(--warn);border-left:3px solid var(--warn);padding:2px 0 2px 10px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ex.complete{border-color:var(--good)}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exhead h2{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.target{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}
.last{font-size:12px;color:var(--muted);margin-top:2px}
.last b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.unit{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;font:600 11px var(--f-num);padding:4px 9px;cursor:pointer;text-transform:uppercase}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:8px;align-items:center}
.set .n{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:center}
.field{position:relative;min-width:0}
.field input{width:100%;font:500 16px var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 38px 9px 10px;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input::placeholder{color:var(--muted);opacity:.7}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px var(--f-num);color:var(--muted);pointer-events:none}
.chk{appearance:none;width:46px;height:42px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.chk svg{width:20px;height:20px}
.chk.on{background:var(--good);border-color:var(--good);color:#fff}
.set.done .field input{background:var(--good-soft);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.card p{margin:0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{appearance:none;border:none;background:var(--accent);color:var(--accent-ink);font:600 15px var(--f-body);padding:10px 16px;border-radius:9px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{font-size:13px;padding:7px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font:600 20px var(--f-num);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.spark{width:100%;height:90px;display:block}
.log{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.log div{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.x{appearance:none;border:none;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 6px;line-height:1}
.nights{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.night{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:9px 0;font:600 12px var(--f-body);cursor:pointer}
.night.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.night.today{border-color:var(--accent)}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.restday{display:flex;flex-direction:column;gap:6px}
.timer{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px;justify-content:space-between;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.timer .t{font:600 28px var(--f-num);font-variant-numeric:tabular-nums}
.timer .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.timer.over{background:var(--good);color:#fff}
.timer .btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.confirm{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Iron<span>Week</span></div>
    <div class="wk" id="wk"></div>
  </header>
  <nav class="strip" id="strip" aria-label="Training days"></nav>
  <main id="main" style="display:flex;flex-direction:column;gap:12px"></main>
</div>
<div class="timer" id="timer" hidden>
  <div><div class="lbl" id="tlbl">Rest</div><div class="t" id="tval">0:00</div></div>
  <div class="row"><button class="btn ghost small" id="tplus">+30s</button><button class="btn ghost small" id="tskip">Done</button></div>
</div>

<script>
const PLAN = [
  {id:'mon', dow:1, short:'Mon', day:'Monday', title:'Legs', sub:'Quads', leg:true, ex:[
    ['Hack squat',4,'6–10',180,'kg'],['Leg press',3,'8–10',180,'kg'],['Leg extensions',3,'10–12',90,'kg'],['Calf raises',3,'10–15',90,'kg']]},
  {id:'tue', dow:2, short:'Tue', day:'Tuesday', title:'Chest, Shoulders & Biceps', sub:'Push + curls', ex:[
    ['Bench press',4,'6–10',180,'kg'],['Weighted dips',3,'6–10',150,'kg'],['Incline dumbbell press',3,'8–12',120,'kg'],['Flyes',3,'10–12',90,'lb'],['Lateral raises',3,'10–15',60,'kg'],['Dumbbell curls',3,'8–12',60,'kg']]},
  {id:'wed', dow:3, short:'Wed', day:'Wednesday', title:'Back & Triceps', sub:'Pull + a bit of chest', ex:[
    ['Weighted pull-ups',4,'6–10',150,'kg'],['Incline dumbbell press',3,'8–12',120,'kg'],['Rows',3,'8–12',120,'kg'],['Overhead triceps extension',3,'8–12',90,'kg'],['Triceps pushdowns',3,'10–12',60,'kg']]},
  {id:'thu', dow:4, short:'Thu', day:'Thursday', title:'Legs', sub:'Hamstrings & glutes', leg:true, ex:[
    ['Romanian deadlifts / hip thrusts',3,'6–10',180,'kg'],['Hack squat (lighter)',3,'8–10',180,'kg'],['Leg curls',3,'10–12',90,'kg'],['Calf raises',3,'10–15',90,'kg']]}
];
const LS='ironweek.v1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function weekKey(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return ymd(x)}
function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S=load();
S.sets=S.sets||{}; S.abs=S.abs||[]; S.bw=S.bw||[]; S.last=S.last||{}; S.units=S.units||{};
if(!S.bw.length && !S.started){S.bw=[{d:ymd(new Date()),kg:55}];}
S.started=true;
function checkWeek(){const wk=weekKey(new Date());if(S.week!==wk){S.week=wk;S.sets={};S.abs=[];save();}}
checkWeek();

const todayIdx=()=>(new Date().getDay()+6)%7; // 0=Mon
let view=(()=>{const i=todayIdx();return i<4?PLAN[i].id:'body'})();
let confirmReset=false;

function setsFor(day,i){const id=day.id+'-'+i;const n=day.ex[i][1];if(!S.sets[id])S.sets[id]=[];while(S.sets[id].length<n)S.sets[id].push({w:'',r:'',done:false});return S.sets[id]}
function dayCount(day){let d=0,t=0;day.ex.forEach((e,i)=>{const arr=S.sets[day.id+'-'+i]||[];t+=e[1];d+=arr.filter(s=>s.done).length});return [d,t]}
const unitOf=e=>S.units[e[0]]||e[4];

function renderStrip(){
  const ti=todayIdx();
  const tabs=PLAN.map((d,i)=>{const [dn,t]=dayCount(d);return `<button class="tab${view===d.id?' on':''}${ti===i?' today':''}${dn===t?' full':''}" data-view="${d.id}"><b>${d.short}</b><small>${dn}/${t}</small></button>`});
  const absN=S.abs.filter(Boolean).length;
  tabs.push(`<button class="tab${view==='body'?' on':''}${ti>=4?' today':''}" data-view="body"><b>Body</b><small>abs ${absN}/4</small></button>`);
  document.getElementById('strip').innerHTML=tabs.join('');
  const mon=new Date(S.week+'T00:00:00');
  document.getElementById('wk').textContent='Week of '+mon.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function renderDay(day){
  const [dn,t]=dayCount(day);
  let h=`<section class="dayhead"><div class="wk">${day.day} · ${esc(day.sub)}</div><h1>${esc(day.title)}</h1>
    <div class="bar${dn===t?' done':''}"><i style="width:${t?dn/t*100:0}%"></i></div>
    <p>${dn===t?'All sets done. Eat well and rest.':`${dn} of ${t} sets done`}</p></section>`;
  if(day.leg) h+=`<div class="note">Walk between sets, don't sit. Leave 2–3 reps in the tank. Eat 1.5–2 h before.</div>`;
  day.ex.forEach((e,i)=>{
    const arr=setsFor(day,i), u=unitOf(e), L=S.last[e[0]];
    const done=arr.every(s=>s.done);
    const lowR=e[2].split('–')[0];
    h+=`<article class="ex${done?' complete':''}"><div class="exhead"><div><h2>${esc(e[0])}</h2>
      <div class="last">${L?`Last: <b>${esc(L.w)} ${esc(L.u)} × ${esc(L.r)}</b>`:'No weight logged yet'}</div></div>
      <div class="row" style="flex-wrap:nowrap"><span class="target">${e[1]} × ${e[2]}</span><button class="unit" data-unit="${i}" aria-label="Switch units">${u}</button></div></div><div class="sets">`;
    arr.forEach((s,k)=>{
      h+=`<div class="set${s.done?' done':''}"><span class="n">${k+1}</span>
        <label class="field"><input id="w-${day.id}-${i}-${k}" inputmode="decimal" type="number" step="0.5" placeholder="${L?esc(L.w):'0'}" value="${esc(s.w)}" data-f="w" data-i="${i}" data-k="${k}" aria-label="Weight set ${k+1}"><span>${u}</span></label>
        <label class="field"><input id="r-${day.id}-${i}-${k}" inputmode="numeric" type="number" placeholder="${L?esc(L.r):lowR}" value="${esc(s.r)}" data-f="r" data-i="${i}" data-k="${k}" aria-label="Reps set ${k+1}"><span>reps</span></label>
        <button class="chk${s.done?' on':''}" data-chk="${i}-${k}" aria-label="Mark set ${k+1} done">${CHECK}</button></div>`;
    });
    h+=`</div></article>`;
  });
  return h;
}

function spark(pts){
  if(pts.length<2) return '<p class="muted">Log your weight a few mornings a week to see the trend.</p>';
  const W=320,H=90,P=8; const ks=pts.map(p=>p.kg);
  let lo=Math.min(...ks),hi=Math.max(...ks); if(hi-lo<1){const m=(hi+lo)/2;lo=m-.5;hi=m+.5}
  const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.kg).toFixed(1)}`).join('');
  const area=line+`L${x(pts.length-1)},${H-P}L${x(0)},${H-P}Z`;
  const lx=x(pts.length-1),ly=y(pts[pts.length-1].kg);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Bodyweight trend">
    <line x1="${P}" x2="${W-P}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <line x1="${P}" x2="${W-P}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="4" fill="var(--accent)"/></svg>
    <div class="row muted" style="justify-content:space-between"><span>${pts[0].d.slice(5)}</span><span>${lo.toFixed(1)}–${hi.toFixed(1)} kg</span><span>${pts[pts.length-1].d.slice(5)}</span></div>`;
}

function renderBody(){
  const bw=[...S.bw].sort((a,b)=>a.d<b.d?-1:1);
  const last=bw[bw.length-1], first=bw[0];
  let rate=null;
  if(bw.length>1){const days=(new Date(last.d)-new Date(first.d))/864e5; if(days>=7) rate=(last.kg-first.kg)/(days/7);}
  let pill='<span class="pill">Need 1+ week of entries</span>';
  if(rate!==null){ if(rate<0.2) pill='<span class="pill warn">Too slow · eat more</span>'; else if(rate>0.6) pill='<span class="pill warn">Fast · ease off a little</span>'; else pill='<span class="pill good">On track</span>'; }
  const ti=todayIdx(), names=['M','T','W','T','F','S','S'], absN=S.abs.filter(Boolean).length;
  let h='';
  if(ti>=4) h+=`<section class="dayhead"><div class="wk">${new Date().toLocaleDateString(undefined,{weekday:'long'})}</div><h1>Rest day</h1><p>Recovery is when you grow. Eat, sleep 7–9 hours, log your weight.</p></section>`;
  else h+=`<section class="dayhead"><div class="wk">Weekly</div><h1>Body & abs</h1></section>`;
  h+=`<section class="card"><div class="row" style="justify-content:space-between"><h2>Bodyweight</h2>${pill}</div>
    <div class="stats"><div class="stat"><small>Now</small><b>${last?last.kg.toFixed(1):'–'}</b></div>
    <div class="stat"><small>Change</small><b>${bw.length>1?((last.kg-first.kg>=0?'+':'')+(last.kg-first.kg).toFixed(1)):'–'}</b></div>
    <div class="stat"><small>Per week</small><b>${rate!==null?(rate>=0?'+':'')+rate.toFixed(2):'–'}</b></div></div>
    ${spark(bw.slice(-30))}
    <form class="row" id="bwform"><label class="field" style="flex:1"><input id="bwin" type="number" inputmode="decimal" step="0.1" placeholder="${last?last.kg:'55'}" aria-label="Today's weight"><span>kg</span></label><button class="btn" type="submit">Log today</button></form>
    <p class="muted">Target +0.25–0.5 kg a week. Weigh in the morning before eating.</p>
    <div class="log">${bw.slice(-6).reverse().map(p=>`<div><span>${p.d}</span><span>${p.kg.toFixed(1)} kg <button class="x" data-del="${p.d}" aria-label="Delete ${p.d}">×</button></span></div>`).join('')}</div></section>`;
  h+=`<section class="card"><div class="row" style="justify-content:space-between"><h2>Abs</h2><span class="pill${absN>=3?' good':''}">${absN} / 3–4 nights</span></div>
    <p class="muted">Standing ab wheel rollouts, 3 × 6–10. Partial range first, back stays flat.</p>
    <div class="nights">${names.map((n,i)=>`<button class="night${S.abs[i]?' on':''}${i===ti?' today':''}" data-abs="${i}">${n}</button>`).join('')}</div></section>`;
  h+=`<section class="card"><h2>Rules</h2><ul class="rules">
    <li>Leave 1–3 reps in the tank. On legs, 2–3 for the first month.</li>
    <li>Rest 2–3 min on legs, presses and weighted pull-ups/dips; 1–2 min on the rest.</li>
    <li>Beat last week: one more rep, or a little more weight once you hit the top of the range.</li>
    <li>90–120 g protein a day. Sleep 7–9 hours.</li></ul></section>`;
  h+=`<section class="card"><h2>This week</h2><p class="muted">Sets and abs reset every Monday. Weights, last lifts and bodyweight stay. Everything is saved on this phone only.</p>
    ${confirmReset?`<div class="confirm"><p>Clear all checked sets for this week?</p><div class="row"><button class="btn" data-act="reset-yes">Clear week</button><button class="btn ghost" data-act="reset-no">Keep</button></div></div>`:`<div><button class="btn ghost small" data-act="reset">Clear this week's sets</button></div>`}</section>`;
  return h;
}

function render(){checkWeek();renderStrip();const m=document.getElementById('main');const d=PLAN.find(p=>p.id===view);m.innerHTML=d?renderDay(d):renderBody();}

/* Rest timer */
let tEnd=0,tTick=null;
const timerEl=document.getElementById('timer');
function startTimer(sec,label){tEnd=Date.now()+sec*1000;document.getElementById('tlbl').textContent='Rest · '+label;timerEl.hidden=false;timerEl.classList.remove('over');clearInterval(tTick);tTick=setInterval(tick,250);tick();}
let buzzed=false;
function tick(){const left=Math.round((tEnd-Date.now())/1000);const a=Math.abs(left);document.getElementById('tval').textContent=(left<0?'+':'')+Math.floor(a/60)+':'+pad(a%60);
  if(left<=0){timerEl.classList.add('over');if(!buzzed){buzzed=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}}else buzzed=false;}
document.getElementById('tplus').onclick=()=>{tEnd+=30000;tick()};
document.getElementById('tskip').onclick=()=>{clearInterval(tTick);timerEl.hidden=true};

/* Events */
document.getElementById('strip').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;confirmReset=false;render();window.scrollTo(0,0)});
const main=document.getElementById('main');
main.addEventListener('input',e=>{const t=e.target;if(!t.dataset.f)return;const d=PLAN.find(p=>p.id===view);setsFor(d,+t.dataset.i)[+t.dataset.k][t.dataset.f]=t.value;save()});
main.addEventListener('click',e=>{
  const d=PLAN.find(p=>p.id===view);
  const c=e.target.closest('[data-chk]');
  if(c&&d){const [i,k]=c.dataset.chk.split('-').map(Number);const ex=d.ex[i];const s=setsFor(d,i)[k];
    s.done=!s.done;
    if(s.done){const L=S.last[ex[0]];if(s.w==='')s.w=L?L.w:'';if(s.r==='')s.r=L?L.r:ex[2].split('–')[0];
      if(s.w!=='')S.last[ex[0]]={w:s.w,r:s.r,u:unitOf(ex)};startTimer(ex[3],ex[0]);}
    save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const u=e.target.closest('[data-unit]');
  if(u&&d){const ex=d.ex[+u.dataset.unit];S.units[ex[0]]=unitOf(ex)==='kg'?'lb':'kg';save();const y=window.scrollY;render();window.scrollTo(0,y);return;}
  const a=e.target.closest('[data-abs]');
  if(a){const i=+a.dataset.abs;S.abs[i]=!S.abs[i];save();render();return;}
  const x=e.target.closest('[data-del]');
  if(x){S.bw=S.bw.filter(p=>p.d!==x.dataset.del);save();render();return;}
  const act=e.target.closest('[data-act]');
  if(act){const v=act.dataset.act;if(v==='reset')confirmReset=true;if(v==='reset-no')confirmReset=false;if(v==='reset-yes'){S.sets={};S.abs=[];confirmReset=false;save();}render();}
});
main.addEventListener('submit',e=>{if(e.target.id!=='bwform')return;e.preventDefault();const v=parseFloat(document.getElementById('bwin').value);if(!(v>20&&v<300))return;const t=ymd(new Date());S.bw=S.bw.filter(p=>p.d!==t);S.bw.push({d:t,kg:v});save();render();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

render();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
</body>
